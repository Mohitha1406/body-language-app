name: Appium Mobile E2E Tests

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  appium-mobile-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Android Debug APK
        run: |
          flutter pub get
          flutter build apk --debug

      - name: Install Global Appium & Drivers
        run: |
          npm install -g appium
          npx appium driver install uiautomator2

      - name: Install Appium Suite Dependencies
        run: |
          cd BodyLanguageAppium
          npm install

      - name: Enable KVM Hardware Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Appium Mobile E2E Tests on Android Emulator (1,111 Tests)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot-load -no-window -no-audio -no-boot-anim -camera-back fake
          disable-animations: true
          script: |
            chmod +x BodyLanguageAppium/scripts/ci_run_tests.sh
            ./BodyLanguageAppium/scripts/ci_run_tests.sh

      - name: Upload Appium Mobile Excel & HTML Test Report Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-mobile-test-reports
          path: |
            BodyLanguageAppium/reports/Appium_Mobile_E2E_Test_Report.xlsx
            BodyLanguageAppium/reports/execution-report.html
            reports/Appium_Mobile_E2E_Test_Report.xlsx
