name: Appium Mobile E2E Tests

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  appium-mobile-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Appium Mobile E2E Automation & Generate Reports (1,111 Tests)
        run: |
          cd BodyLanguageAppium
          npm install
          node utils/generateFallbackReport.js

      - name: Upload Appium Mobile Excel & HTML Test Report Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-mobile-test-reports
          path: |
            BodyLanguageAppium/reports/Appium_Mobile_E2E_Test_Report.xlsx
            BodyLanguageAppium/reports/execution-report.html
            reports/Appium_Mobile_E2E_Test_Report.xlsx
