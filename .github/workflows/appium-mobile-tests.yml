name: Appium Mobile E2E Tests

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  appium-mobile-tests:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Android Release APK
        run: |
          flutter pub get
          flutter build apk --release

      - name: Install Appium Server & UiAutomator2 Driver
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Install Testing Dependencies
        run: |
          cd testing
          npm install

      - name: Run Appium Tests on macOS Hardware Accelerated Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-load -no-window -no-audio -no-boot-anim -camera-back fake
          disable-animations: true
          script: |
            appium --log appium.log &
            sleep 8
            cd testing
            npm run test:mobile

      - name: Upload Mobile Excel Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-mobile-test-report
          path: testing/reports/Appium_Mobile_E2E_Test_Report.xlsx
