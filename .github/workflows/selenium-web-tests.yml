name: Selenium Web E2E Tests

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  selenium-web-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Flutter Unit Tests
        run: |
          flutter pub get
          flutter test test/unit/

      - name: Verify Web Release Build
        run: |
          flutter build web --release

      - name: Install Google Chrome Browser
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Run Selenium Web E2E Test Suite (300 Test Cases)
        env:
          HEADLESS: "true"
        run: |
          cd testing
          npm install
          node run_all_tests.js

      - name: Upload Selenium Web Excel Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-web-test-reports
          path: |
            reports/Selenium_Web_E2E_Test_Report.xlsx
            reports/Master_E2E_Analysis_Report.xlsx
